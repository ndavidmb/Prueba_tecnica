services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: PolleFutboleraDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yourpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=db;Database=PolleFutboleraDb;Username=postgres;Password=${DB_PASSWORD:-yourpassword}
      - Jwt__SecretKey=${JWT_SECRET:-local-development-only-signing-key-please-override-in-dot-env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
