<div class="overflow-hidden rounded-lg bg-surface shadow">
  <table class="w-full">
    <thead>
      <tr
        class="border-b border-gray-200 bg-gray-50 text-left text-xs font-medium uppercase text-gray-500"
      >
        <th class="px-4 py-3">Posición</th>
        <th class="px-4 py-3">Nombre</th>
        <th class="px-4 py-3">Puntos</th>
        <th class="px-4 py-3">Apuestas</th>
      </tr>
    </thead>
    <tbody>
      @for (entry of entries(); track entry.userId) {
        <tr
          (click)="selectUser.emit(entry.userId)"
          class="cursor-pointer border-b border-gray-200 last:border-b-0 hover:bg-accent-soft"
          [class.bg-accent-soft]="selectedUserId() === entry.userId"
        >
          <td class="px-4 py-3 text-sm font-medium text-gray-900">#{{ entry.rankPosition }}</td>
          <td class="px-4 py-3 text-sm text-gray-900">
            <div class="flex gap-2 items-center">
              {{ entry.userName }}
            </div>
          </td>
          <td class="px-4 py-3 text-sm text-gray-900">{{ entry.totalPoints }}</td>
          <td class="px-4 py-3 text-sm text-gray-600">{{ entry.totalBets }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
